<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | Library Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="auth-card">

    <a href="../home/index.html" class="brand" aria-label="Library home">
      <svg class="brand__icon" viewBox="0 0 24 24" width="26" height="26" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path>
        <path d="M4 21V5"></path>
        <path d="M9 7h6"></path>
      </svg>
      <span class="brand__name">LIBRARY<span class="brand__dot">.</span></span>
    </a>

    <header class="auth-header">
      <p class="auth-header__eyebrow">Your knowledge journey</p>
      <h1 class="auth-header__title">Welcome back</h1>
      <p class="auth-header__text">Sign in to continue exploring your library.</p>
    </header>

    <form id="loginForm" class="auth-form" novalidate>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="name@example.com"
               autocomplete="email" aria-describedby="emailError">
        <p class="field__error" id="emailError"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="field__password">
          <input type="password" id="password" name="password" placeholder="Enter your password"
                 autocomplete="current-password" aria-describedby="passwordError">
          <button type="button" id="togglePassword" class="field__toggle"
                  aria-controls="password" aria-pressed="false">Show</button>
        </div>
        <p class="field__error" id="passwordError"></p>
      </div>

      <div id="formMessage" class="form-message" aria-live="polite"></div>

      <button type="submit" id="submitBtn" class="btn-submit">
        <span id="submitText">Sign in</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path>
        </svg>
      </button>
    </form>

    <p class="auth-footer">
      New to the library? <a href="../register/regi.html">Create account</a>
    </p>
  </main>

  <script src="login.js"></script>
</body>
</html>
